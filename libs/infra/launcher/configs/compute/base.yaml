# Number of cpus per job in sweep (e.g. 1).
cpu: 1
# Number of gpus per job in sweep (e.g. 1 or "v100:1").
gpu: 0
# Memory (in GB) per job in sweep.
mem: 16
# Time allotted (in minutes > 0) per job in sweep.
time: 60
# Containerized Python starter (e.g. relative path in `infra/containers`, absolute path, or `null`).
container: null
